services:
  postgres:
    image: postgres:17
    container_name: puong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_customer_support
      POSTGRES_USER: puong
      POSTGRES_PASSWORD: puong123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: